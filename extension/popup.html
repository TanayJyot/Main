<!DOCTYPE html>
<html>
<head>
    <title>ASLytics</title>
    <style>
        body {
            font-family: Arial;
            width: 250px;
            padding: 15px;
        }

        h2 {
            margin: 0;
            font-size: 18px;
        }

        button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: none;
            background: black;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }

        #status {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>
    <h2>ASLytics</h2>

    <button id="startBtn">Start ASL Translation</button>
    <button id="stopBtn">Stop</button>

    <div id="status">Status: Idle</div>

    <script src="popup.js"></script>
</body>
</html>
